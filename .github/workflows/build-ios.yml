name: Build WordLoop iPhone App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ios/WordLoop.xcodeproj \
            -scheme WordLoop \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WordLoop.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload WordLoop-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordLoop-iPhone
          path: WordLoop-unsigned.ipa
          if-no-files-found: error
